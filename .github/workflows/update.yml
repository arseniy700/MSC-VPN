name: Update VPN Subscription

on:
  schedule:
    - cron: '0 */6 * * *' # Обновление каждые 6 часов
  workflow_dispatch:      # Кнопка для ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    # Даем права на запись в репозиторий
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python update.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add subscription.txt
          # Проверяем, есть ли изменения, чтобы не вызывать ошибку пустого коммита
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: 🆓Free MSC VPN🗽"
            git push
          fi
          
